# Docker Compose Development Override for JackVerse Caseworker
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  caseworker-api:
    environment:
      - CASEWORKER_DEV_AUTH=true
      - CASEWORKER_ALLOWED_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - caseworker_data:/app/.caseworker
