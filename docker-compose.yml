name: jackverse-agent-runtime

services:
  transport-mcp:
    build:
      context: .
      dockerfile: Dockerfile.transport
    expose:
      - "8000"
    networks:
      - agent-net
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, urllib.error, sys\ntry:\n    urllib.request.urlopen('http://127.0.0.1:8000/mcp', timeout=2)\n    sys.exit(0)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code in (400, 405, 406) else 1)\nexcept Exception:\n    sys.exit(1)"
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  harness:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      - AGENT_HARNESS_CONFIG=config/config.docker.yaml
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30.0}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_EXTRA_HEADERS=${LLM_EXTRA_HEADERS:-}
      - PYTHONPATH=/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      transport-mcp:
        condition: service_healthy
      tempo:
        condition: service_started
    volumes:
      - agent_memory:/app/.agent_memory
      - ./workspace:/app/workspace
    networks:
      - agent-net

  tempo:
    image: grafana/tempo:3.0.2
    command:
      - "-config.file=/etc/tempo.yml"
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - agent-net

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agent-net

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
      - tempo
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - agent-net

volumes:
  agent_memory:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  agent-net:
    driver: bridge
