server {
    listen 80;
    server_name localhost;

    # Health check endpoint allowed on HTTP for local liveness probes
    location /health {
        proxy_pass http://caseworker-api:8080/health;
        proxy_set_header Host $host;
    }

    # Redirect all HTTP traffic (SPA and API) to HTTPS on port 3443
    location / {
        return 307 https://localhost:3443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Caseworker API container (forwards verified HTTPS scheme)
    location /api/ {
        proxy_pass http://caseworker-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://caseworker-api:8080/health;
        proxy_set_header Host $host;
    }
}
